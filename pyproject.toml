[project]
name = "third-party-vendor-risk-framework"
version = "0.1.0"
description = "Explainable third-party vendor risk assessment automation using NIST SP 800-161 Rev. 1 concepts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.2,<5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
